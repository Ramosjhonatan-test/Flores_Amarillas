<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#24120d">
    <title>Para Jhosselin | Flores amarillas</title>
    <link rel="stylesheet" href="portada.css">
</head>
<body>
    <div class="sunflower-loader" id="sunflower-loader" role="status" aria-label="Preparando tu sorpresa">
        <div class="sunflower-loader__flower" aria-hidden="true">
            <span class="sunflower-loader__petal" style="--i: 0"></span><span class="sunflower-loader__petal" style="--i: 1"></span><span class="sunflower-loader__petal" style="--i: 2"></span><span class="sunflower-loader__petal" style="--i: 3"></span><span class="sunflower-loader__petal" style="--i: 4"></span><span class="sunflower-loader__petal" style="--i: 5"></span><span class="sunflower-loader__petal" style="--i: 6"></span><span class="sunflower-loader__petal" style="--i: 7"></span><span class="sunflower-loader__petal" style="--i: 8"></span><span class="sunflower-loader__petal" style="--i: 9"></span><span class="sunflower-loader__petal" style="--i: 10"></span><span class="sunflower-loader__petal" style="--i: 11"></span>
            <span class="sunflower-loader__center"></span>
        </div>
        <p class="sunflower-loader__label">Floreciendo para ti</p>
        <span class="sunflower-loader__dots" aria-hidden="true">• • •</span>
    </div>
    <main class="cover">
        <div class="cover__glow" aria-hidden="true"></div>
        <div class="cover__petals cover__petals--one" aria-hidden="true">✦</div>
        <div class="cover__petals cover__petals--two" aria-hidden="true">✿</div>

        <section class="cover-card" aria-labelledby="title">
            <p class="eyebrow">21 de septiembre · un detalle especial</p>
            <h1 id="title">Para <span>Jhosselin</span></h1>
            <div class="divider" aria-hidden="true"><i></i><b>✦</b><i></i></div>
            <p class="message">Hay regalos que no se envuelven: se sienten, se recuerdan y florecen para siempre.</p>
            <p class="signature">Con cariño, <strong>Jhonatan</strong></p>
            <a class="gift-button" href="rosas.html">
                <span>Descubrir tu sorpresa</span>
                <span class="gift-button__icon" aria-hidden="true">→</span>
            </a>
            <p class="hint">Toca el botón para abrirla</p>
        </section>
    </main>
    <script src="carga.js"></script>
</body>
</html>
